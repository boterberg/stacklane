[package]
name = "stacklane"
version = "0.0.1"
edition = "2024"
license = "MIT"

[dependencies]
ammonia = "4.2.5"
anyhow = "1.0.105"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
bcrypt = "0.19.3"
chacha20poly1305 = "0.11.0"
dotenvy = "0.15.7"
hex = "0.4.3"
lettre = { version = "0.11.24", default-features = false, features = ["tokio1", "tokio1-rustls", "smtp-transport", "builder", "hostname", "rustls-native-certs", "ring"] }
libc = "0.2.191"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "uuid", "time", "migrate", "macros"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
