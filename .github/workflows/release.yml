name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: rust:1-bookworm
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tag must look like v0.0.0.0"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run build
      - name: site
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: server
        working-directory: server
        env:
          STACKLANE_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release --locked
      - name: package
        run: |
          keyring=""
          if [ -s packaging/stacklane-release.asc ]; then
            gpg --dearmor < packaging/stacklane-release.asc > stacklane-release.gpg
            keyring="--keyring stacklane-release.gpg"
          fi
          sh packaging/build-deb.sh --version "${{ steps.version.outputs.version }}" \
            --bin server/target/release/stacklane-server --web web/dist --site site/dist --out dist $keyring
          cd dist && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS
      - name: sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SIGNING_FPR: ${{ vars.SIGNING_FPR }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::GPG_PRIVATE_KEY is not set, this release is not signed"
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          if [ -n "$SIGNING_FPR" ]; then
            gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10 }' | grep -qx "$SIGNING_FPR" \
              || { echo "::error::imported key does not belong to SIGNING_FPR"; exit 1; }
          fi
          printf '%s' "$GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" \
            --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          rm -rf "$GNUPGHOME"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get update && apt-get install -y --no-install-recommends gh
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS* \
            --repo "$GITHUB_REPOSITORY" --title "Stacklane $GITHUB_REF_NAME" --generate-notes
