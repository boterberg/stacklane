name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: rust:1-bookworm
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - name: version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tag must look like v0.0.0.0"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run build
      - name: docs
        working-directory: docs
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: server
        env:
          STACKLANE_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release --locked
      - name: package
        run: |
          gpg --dearmor < packaging/stacklane.asc > stacklane.gpg
          sh packaging/build-deb.sh --version "${{ steps.version.outputs.version }}" \
            --bin target/release/stacklane --web web/dist --site docs/dist --keyring stacklane.gpg --out dist
      - name: publish
        env:
          APT_UPLOAD_TOKEN: ${{ secrets.APT_UPLOAD_TOKEN }}
        run: |
          test -n "$APT_UPLOAD_TOKEN" || { echo "::error::APT_UPLOAD_TOKEN is not set"; exit 1; }
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $APT_UPLOAD_TOKEN" \
            -H "Content-Type: application/vnd.debian.binary-package" \
            --data-binary "@dist/stacklane_${{ steps.version.outputs.version }}_amd64.deb" \
            https://stacklane.io/apt/upload
